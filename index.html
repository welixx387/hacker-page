<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm a hacker</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    position: relative;
    background-image:
      linear-gradient(rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0.72)),
      url("bg.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  h1 {
    font-family: "Consolas", "Courier New", monospace;
    font-weight: 700;
    font-size: clamp(2rem, 8vw, 6rem);
    color: #ff2b2b;
    text-shadow:
      0 0 8px rgba(255, 43, 43, 1),
      0 0 20px rgba(255, 43, 43, 0.85),
      0 0 45px rgba(255, 0, 0, 0.6),
      0 0 80px rgba(255, 0, 0, 0.35);
    letter-spacing: 0.06em;
    text-align: center;
    margin: 0;
    padding: 0 1rem;
  }

  .blood-title {
    position: absolute;
    bottom: 6vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
  }

  .blood-title .letter {
    position: relative;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 900;
    font-style: italic;
    font-size: clamp(2rem, 7vw, 4.5rem);
    color: #8a0000;
    background: linear-gradient(180deg, #c2001c 0%, #6b0000 70%, #3d0000 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 18px rgba(180, 0, 0, 0.55);
  }

  .blood-title .letter::after {
    content: "";
    position: absolute;
    top: 92%;
    left: 50%;
    width: 4px;
    height: 0;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #b8001f 0%, #5c0000 90%);
    border-radius: 0 0 50% 50%;
    box-shadow: 0 0 6px rgba(150, 0, 0, 0.6);
    animation: drip 3.2s ease-in infinite;
  }

  .blood-title .letter:nth-child(1)::after { animation-delay: 0s; }
  .blood-title .letter:nth-child(2)::after { animation-delay: 0.5s; }
  .blood-title .letter:nth-child(3)::after { animation-delay: 1s; }
  .blood-title .letter:nth-child(4)::after { animation-delay: 1.6s; }
  .blood-title .letter:nth-child(5)::after { animation-delay: 2.1s; }

  @keyframes drip {
    0% {
      height: 0;
      opacity: 1;
    }
    65% {
      height: 38px;
      opacity: 1;
    }
    100% {
      height: 55px;
      opacity: 0;
    }
  }
</style>
</head>
<body>
  <h1>I'm a hacker</h1>
  <div class="blood-title">
    <span class="letter">F</span>
    <span class="letter">e</span>
    <span class="letter">k</span>
    <span class="letter">o</span>
    <span class="letter">u</span>
  </div>
</body>
</html>
